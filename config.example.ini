# LPC1115 Flasher Configuration File
# Copy to config.ini and modify as needed

[hardware]
# GPIO pin assignments for Raspberry Pi
reset_pin = 18
isp_enable_pin = 17

# UART configuration
uart_port = /dev/ttyAMA0
uart_baudrate = 115200

# Optional: For USB serial adapter
# uart_port = /dev/ttyUSB0

[flash]
# Flash memory layout for LPC1115
flash_start = 0x00000000
flash_end = 0x00007FFF
sector_size = 4096

[ram]
# RAM configuration
ram_start = 0x10000000
ram_size = 0x2000

[timing]
# Timing parameters (in seconds)
autobaud_timeout = 2.0
command_timeout = 1.0
sync_timeout = 0.5
reset_delay = 0.2
erase_delay = 0.3
write_delay = 0.1
copy_delay = 0.2

[debug]
# Enable debug output
verbose = false
show_serial_data = false
save_log_file = false
log_filename = lpc1115_flash.log

[verification]
# Verification options
verify_after_write = true
use_crc = false
compare_byte_by_byte = true
