# LPC11xx Flasher Configuration File
# Copy to config.ini and modify as needed.
# If config.ini exists in the script directory, it is loaded automatically.
# Values shown here are the defaults.

[hardware]
# GPIO pin assignments (BCM numbering)
# Both signals go through an inverter on the PCB:
#   GPIO HIGH → Inverter → LPC pin LOW
#   GPIO LOW  → Inverter → LPC pin HIGH (pull-up)
# This ensures safe state after Raspberry Pi reset (GPIOs = input/pull-down).
reset_pin = 18
isp_enable_pin = 17

# UART configuration
uart_port = /dev/ttyAMA0
uart_baudrate = 115200

# Crystal frequency of the LPC11xx target board in kHz
crystal_freq_khz = 12000

# For USB serial adapter, uncomment:
# uart_port = /dev/ttyUSB0

[flash]
# Flash memory defaults (auto-detected from chip Part ID)
# Only needed to override auto-detection.
# flash_size_kb = 32
# sector_size = 4096

[ram]
# RAM defaults (auto-detected from chip Part ID)
# ram_size_kb = 8

[timing]
# Timing parameters (in seconds)
autobaud_timeout = 2.0
command_timeout = 1.0
sync_timeout = 0.5
reset_delay = 0.2
erase_delay = 0.3
write_delay = 0.1
copy_delay = 0.2

[debug]
# Enable debug output
verbose = false
show_serial_data = false
save_log_file = false
log_filename = lpc1115_flash.log

[verification]
# Verification options
verify_after_write = true
use_crc = false
compare_byte_by_byte = true
